included:
  - SkillSync
  - SkillSyncTests
  - SkillSyncUITests

excluded:
  - DerivedData
  - .build

strict: true
check_for_updates: false

# swift-format owns whitespace and collection layout. Keeping duplicate style
# rules enabled makes the two formatters produce contradictory output.
disabled_rules:
  - closure_parameter_position
  - opening_brace
  - trailing_comma

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - last_where
  - modifier_order
  - overridden_super_call
  - sorted_imports

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

large_tuple:
  warning: 4
  error: 5

nesting:
  type_level: 3
  function_level: 5

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 750

identifier_name:
  min_length:
    warning: 2
  allowed_symbols: ["_"]
  excluded: ["id", "x", "y"]

reporter: xcode
